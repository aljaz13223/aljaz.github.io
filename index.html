<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Aljaž Marolt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one transport ticket on a road surface. Ticket body = name + route of where he is now; perforation; stub = contacts + QR. Left-aligned inside the ticket. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
:root {
  --road: #d6d9d4;        /* light concrete */
  --lane: #ffffff;
  --paper: #ffffff;
  --ink: #13213c;
  --soft: #5b6472;
  --rule: #e3e5e0;
  --signal: #ff6a13;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --text: "Public Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --road: #10171f; --lane: #2a3440; --paper: #1a2430; --ink: #eef0ec; --soft: #a2acba; --rule: #2d3947; --signal: #ff7a2b; color-scheme: dark } }
:root[data-theme="dark"] {
  --road: #10171f; --lane: #2a3440; --paper: #1a2430; --ink: #eef0ec; --soft: #a2acba; --rule: #2d3947; --signal: #ff7a2b; color-scheme: dark }

html { background: var(--road); }
body {
  background: var(--road);
  background-image: linear-gradient(to bottom, var(--lane) 0 46px, transparent 46px 92px);
  background-size: 6px 92px; background-repeat: repeat-y; background-position: center top;
  color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.5;
}
.page { min-height: 100%; display: grid; place-items: start center;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.ticket { width: 100%; max-width: 440px; position: relative; filter: drop-shadow(0 18px 30px rgba(19,33,60,.18)); }
.part { background: var(--paper); position: relative; }
.main { border-radius: 16px 16px 0 0; padding: 22px 22px 26px; display: grid; gap: 22px; }
.stub { border-radius: 0 0 16px 16px; padding: 22px; display: grid; gap: 18px; }

/* notches + perforation between body and stub */
.perf { position: relative; height: 22px; background:
  radial-gradient(circle at 0 50%, transparent 11px, var(--paper) 11.5px) left / 51% 100% no-repeat,
  radial-gradient(circle at 100% 50%, transparent 11px, var(--paper) 11.5px) right / 51% 100% no-repeat; }
.perf::after { content: ""; position: absolute; left: 20px; right: 20px; top: 50%; border-top: 2px dashed var(--rule); }

.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--soft); font-size: 14px; }
.place { color: var(--soft); text-decoration: underline; text-decoration-color: var(--signal); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.place:hover { color: var(--ink); }
.head b { color: var(--ink); font-weight: 600; }
.head .mark { display: grid; grid-template-columns: repeat(3, 7px); gap: 3px; }
.head .mark i { width: 7px; height: 7px; border-radius: 2px; background: var(--ink); }
.head .mark i.h { background: var(--signal); }

.name { margin: 0; font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(3.6rem, 19vw, 5.6rem); line-height: .82; letter-spacing: -.01em; display: grid; }
.name span { display: block; }
.flap { display: inline-block; min-width: .5ch; }

/* route: where he is now */
.route { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; display: grid; gap: 18px; }
.route::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 4px; border-radius: 2px; background: var(--ink); }
.route li { position: relative; }
.route li::before { content: ""; position: absolute; left: -26px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: 4px solid var(--ink); box-sizing: border-box; }
.route li.now::before { background: var(--signal); border-color: var(--signal); }
.stop { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.05; }
.sub { color: var(--soft); font-size: 15px; }

.lines { display: grid; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.line:last-child { border-bottom: 0; }
.line .k { color: var(--soft); font-size: 13px; display: block; }
.line .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; user-select: all; }
.line .v.wait { color: var(--soft); font-weight: 500; user-select: none; }
.line a.v { color: var(--ink); text-decoration: underline; text-decoration-color: var(--signal); text-decoration-thickness: 2px; text-underline-offset: 4px; user-select: auto; }
.tag { flex: none; font-size: 13px; font-weight: 600; color: var(--signal); border: 2px solid var(--signal); border-radius: 999px; padding: 6px 12px; }
.line a.call { display: block; flex: 1; padding-block: 4px; color: var(--ink); text-decoration: none; user-select: auto; }
.line a.call .k { text-decoration: none; }
.line a.call:hover, .line a.call:active { color: var(--signal); }
.line a.call::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--signal); vertical-align: middle; }
.copy { flex: none; font: 600 14px/1 var(--text); padding: 10px 14px; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.copy:hover { background: var(--ink); color: var(--paper); }
.copy:focus-visible, a:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

.scan { display: grid; grid-template-columns: 118px 1fr; gap: 16px; align-items: center; }
.scan img { width: 118px; height: 118px; border-radius: 10px; background: #fff; padding: 6px; box-sizing: border-box; display: block; }
.scan p { margin: 0; color: var(--soft); font-size: 15px; max-width: 26ch; }
.scan p b { color: var(--ink); font-weight: 600; }

@media (max-width: 360px) { .scan { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .flap { transition: none; } }
</style>
</head>
<body>

<div class="page">
  <article class="ticket" aria-label="Profil Aljaža Marolta">
    <div class="part main">
      <div class="head">
        <a class="place" href="https://www.google.com/maps/search/?api=1&amp;query=Maribor%2C%20Slovenija" target="_blank" rel="noopener">Maribor, <b>Slovenija</b></a>
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="h"></i><i></i></span>
      </div>

      <h1 class="name" id="name" aria-label="Aljaž Marolt"><span data-word="ALJAŽ">ALJAŽ</span><span data-word="MAROLT">MAROLT</span></h1>

      <ol class="route" aria-label="Kje sem zdaj">
        <li class="now">
          <div class="stop">Višja prometna šola Maribor</div>
          <div class="sub">Računalništvo in informatika, 1. letnik</div>
        </li>
        <li class="now">
          <div class="stop">IT Melona</div>
          <div class="sub">Študentsko delo v IT</div>
        </li>
      </ol>
    </div>

    <div class="perf" aria-hidden="true"></div>

    <div class="part stub" id="kontakt">
      <div class="lines">
        <div class="line">
          <a class="v call" id="v-phone" href="tel:+38630316119"><span class="k">Telefon</span>+386 30 316 119</a>
        </div>
        <div class="line">
          <a class="v call" id="v-mail" href="mailto:aljaz.marolt6@gmail.com"><span class="k">E-mail</span>aljaz.marolt6@gmail.com</a>
        </div>
        <div class="line">
          <a class="v call" href="https://github.com/aljaz13223" target="_blank" rel="noopener"><span class="k">GitHub</span>github.com/aljaz13223</a>
        </div>
        <div class="line">
          <div class="v"><span class="k">Projekt</span>Marox AI</div>
          <span class="tag">V nastajanju</span>
        </div>
      </div>
    </div>
  </article>
</div>

<script>

/* split-flap: the name rolls once like a departure board, then settles. Readable at rest. */
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const chars = 'ABCDEFGHIJKLMNOPRSŠTUVZŽ';
  document.querySelectorAll('.name span').forEach((span, w) => {
    const word = span.dataset.word;
    span.textContent = '';
    const cells = [...word].map((ch) => { const c = document.createElement('span'); c.className = 'flap'; c.style.display = 'inline-block'; c.textContent = ch; span.appendChild(c); return c; });
    cells.forEach((c, i) => {
      const target = word[i]; let n = 0; const stop = 6 + i * 2 + w * 4;
      const t = setInterval(() => {
        if (++n >= stop) { c.textContent = target; clearInterval(t); return; }
        c.textContent = chars[Math.floor(Math.random() * chars.length)];
      }, 45);
    });
  });
})();
</script>

</body>
</html>
